<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Corrected context effects relative to problem only</title>
  <desc id="desc">Six pass-rate differences with adjusted 98.333 percent confidence intervals. Only GPT-5 with failed code lies wholly above zero.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #24292f; }
    .label { font-size: 16px; }
    .tick { font-size: 14px; fill: #57606a; }
    .interval { stroke: #57606a; stroke-width: 4; }
    .point { fill: #57606a; }
    .positive { stroke: #1a7f37; fill: #1a7f37; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .zero { stroke: #24292f; stroke-width: 2; }
  </style>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="600">
    Corrected pass-rate differences relative to B1
  </text>
  <text x="500" y="56" text-anchor="middle" class="tick">
    Adjusted 98.333% problem-clustered BCa intervals
  </text>

  <line x1="280" y1="80" x2="280" y2="470" class="grid"/>
  <line x1="388.3" y1="80" x2="388.3" y2="470" class="grid"/>
  <line x1="496.7" y1="80" x2="496.7" y2="470" class="grid"/>
  <line x1="605" y1="80" x2="605" y2="470" class="zero"/>
  <line x1="713.3" y1="80" x2="713.3" y2="470" class="grid"/>
  <line x1="821.7" y1="80" x2="821.7" y2="470" class="grid"/>
  <line x1="930" y1="80" x2="930" y2="470" class="grid"/>

  <text x="260" y="120" text-anchor="end" class="label">Claude B2 - B1</text>
  <line x1="380.1" y1="115" x2="727.6" y2="115" class="interval"/>
  <circle cx="584.6" cy="115" r="7" class="point"/>

  <text x="260" y="180" text-anchor="end" class="label">Claude B3 - B1</text>
  <line x1="523.3" y1="175" x2="829.9" y2="175" class="interval"/>
  <circle cx="686.7" cy="175" r="7" class="point"/>

  <text x="260" y="240" text-anchor="end" class="label">Claude B4 - B1</text>
  <line x1="319.7" y1="235" x2="710.3" y2="235" class="interval"/>
  <circle cx="543.7" cy="235" r="7" class="point"/>

  <text x="260" y="320" text-anchor="end" class="label">GPT-5 B2 - B1</text>
  <line x1="625.4" y1="315" x2="829.9" y2="315" class="interval positive"/>
  <circle cx="707.3" cy="315" r="7" class="positive"/>

  <text x="260" y="380" text-anchor="end" class="label">GPT-5 B3 - B1</text>
  <line x1="400.7" y1="375" x2="727.6" y2="375" class="interval"/>
  <circle cx="584.6" cy="375" r="7" class="point"/>

  <text x="260" y="440" text-anchor="end" class="label">GPT-5 B4 - B1</text>
  <line x1="523.3" y1="435" x2="748" y2="435" class="interval"/>
  <circle cx="646" cy="435" r="7" class="point"/>

  <text x="280" y="495" text-anchor="middle" class="tick">-0.15</text>
  <text x="388.3" y="495" text-anchor="middle" class="tick">-0.10</text>
  <text x="496.7" y="495" text-anchor="middle" class="tick">-0.05</text>
  <text x="605" y="495" text-anchor="middle" class="tick">0</text>
  <text x="713.3" y="495" text-anchor="middle" class="tick">+0.05</text>
  <text x="821.7" y="495" text-anchor="middle" class="tick">+0.10</text>
  <text x="930" y="495" text-anchor="middle" class="tick">+0.15</text>
</svg>
